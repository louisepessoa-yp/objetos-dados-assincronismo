<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetos, Dados e Assincronismo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        section {
            margin-bottom: 35px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
        }

        button {
            cursor: pointer;
        }

        img {
            max-width: 180px;
            image-rendering: pixelated;
        }

        .status {
            margin-top: 10px;
        }

        dt {
            font-weight: bold;
            margin-top: 8px;
        }

        dd {
            margin-left: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Objetos, Dados e Assincronismo</h1>
        <p>Projeto de consumo de APIs com JavaScript.</p>
    </header>

    <main>
        <section>
            <h2>Buscador de CEP</h2>

            <form id="formulario-cep">
                <label for="cep">Digite o CEP:</label>
                <input
                    type="text"
                    id="cep"
                    placeholder="Ex.: 01001000"
                    inputmode="numeric"
                    maxlength="9"
                >
                <button type="submit" id="botao-cep">Buscar CEP</button>
            </form>

            <p id="status-cep" class="status" role="status" aria-live="polite"></p>
            <dl id="resultado-cep"></dl>

            <h3>Histórico de CEPs</h3>
            <ul id="historico-ceps"></ul>
        </section>

        <section>
            <h2>Mini Pokédex</h2>

            <form id="formulario-pokemon">
                <label for="pokemon">Nome do Pokémon:</label>
                <input
                    type="text"
                    id="pokemon"
                    placeholder="Ex.: pikachu"
                >
                <button type="submit" id="botao-pokemon">
                    Buscar Pokémon
                </button>
            </form>

            <p id="status-pokemon" class="status" role="status" aria-live="polite"></p>
            <div id="resultado-pokemon"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
